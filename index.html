<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRAN — London Restaurant Reviews</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="map"></div>

<header id="header">
  <h1>SCRAN</h1>
  <div id="auth-area">
    <button id="signin-btn">Sign in with Google</button>
    <div id="user-info" style="display:none">
      <span id="user-avatar">🍔</span>
      <span id="user-name"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </div>
  <div id="status-text">
    <span id="status-dot"></span>
    <span id="status-msg"></span>
  </div>
  <button id="profile-btn" aria-label="My profile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </button>
</header>

<div id="filter-sidebar">
  <div class="fs-section">
    <button class="fs-toggle collapsed" data-target="fs-kind-list">Type <span class="fs-arrow">▾</span></button>
    <div class="fs-collapsible collapsed" id="fs-kind-list">
      <button class="fs-chip selected" data-filter="kind" data-value="">Everything</button>
      <button class="fs-chip" data-filter="kind" data-value="eat"><span class="kind-dot kind-eat"></span>Restaurants</button>
      <button class="fs-chip" data-filter="kind" data-value="pub"><span class="kind-dot kind-pub"></span>Pubs &amp; bars</button>
      <button class="fs-chip" data-filter="kind" data-value="cafe"><span class="kind-dot kind-cafe"></span>Caf&eacute;s</button>
    </div>
  </div>
  <div class="fs-divider"></div>
  <div class="fs-section">
    <button class="fs-toggle collapsed" data-target="fs-area-list">Area <span class="fs-arrow">▾</span></button>
    <div class="fs-collapsible collapsed" id="fs-area-list">
      <button class="fs-chip selected" data-filter="area" data-value="">All London</button>
      <button class="fs-chip" data-filter="area" data-value="Soho">Soho</button>
      <button class="fs-chip" data-filter="area" data-value="Covent Garden">Covent Garden</button>
      <button class="fs-chip" data-filter="area" data-value="Mayfair">Mayfair</button>
      <button class="fs-chip" data-filter="area" data-value="Marylebone">Marylebone</button>
      <button class="fs-chip" data-filter="area" data-value="Fitzrovia">Fitzrovia</button>
      <button class="fs-chip" data-filter="area" data-value="Clerkenwell">Clerkenwell</button>
      <button class="fs-chip" data-filter="area" data-value="Shoreditch">Shoreditch</button>
      <button class="fs-chip" data-filter="area" data-value="Dalston">Dalston</button>
      <button class="fs-chip" data-filter="area" data-value="Hackney">Hackney</button>
      <button class="fs-chip" data-filter="area" data-value="Bethnal Green">Bethnal Green</button>
      <button class="fs-chip" data-filter="area" data-value="Canary Wharf">Canary Wharf</button>
      <button class="fs-chip" data-filter="area" data-value="Greenwich">Greenwich</button>
      <button class="fs-chip" data-filter="area" data-value="Borough">Borough</button>
      <button class="fs-chip" data-filter="area" data-value="Bermondsey">Bermondsey</button>
      <button class="fs-chip" data-filter="area" data-value="Peckham">Peckham</button>
      <button class="fs-chip" data-filter="area" data-value="Brixton">Brixton</button>
      <button class="fs-chip" data-filter="area" data-value="Clapham">Clapham</button>
      <button class="fs-chip" data-filter="area" data-value="Chelsea">Chelsea</button>
      <button class="fs-chip" data-filter="area" data-value="Kensington">Kensington</button>
      <button class="fs-chip" data-filter="area" data-value="Notting Hill">Notting Hill</button>
      <button class="fs-chip" data-filter="area" data-value="Hammersmith">Hammersmith</button>
      <button class="fs-chip" data-filter="area" data-value="Richmond">Richmond</button>
      <button class="fs-chip" data-filter="area" data-value="Wimbledon">Wimbledon</button>
      <button class="fs-chip" data-filter="area" data-value="Camden">Camden</button>
      <button class="fs-chip" data-filter="area" data-value="Islington">Islington</button>
      <button class="fs-chip" data-filter="area" data-value="Stoke Newington">Stoke Newington</button>
    </div>
  </div>
  <div class="fs-divider"></div>
  <div class="fs-section">
    <button class="fs-toggle collapsed" data-target="fs-cuisine-list">Cuisine <span class="fs-arrow">▾</span></button>
    <div class="fs-collapsible collapsed" id="fs-cuisine-list">
      <button class="fs-chip selected" data-filter="cuisine" data-value="">Any</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Italian">Italian</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Pizza">Pizza</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Indian">Indian</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Chinese">Chinese</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Japanese">Japanese</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Thai">Thai</button>
      <button class="fs-chip" data-filter="cuisine" data-value="French">French</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Turkish">Turkish</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Lebanese">Lebanese</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Greek">Greek</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Spanish">Spanish</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Mexican">Mexican</button>
      <button class="fs-chip" data-filter="cuisine" data-value="American">American</button>
      <button class="fs-chip" data-filter="cuisine" data-value="British">British</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Korean">Korean</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Vietnamese">Vietnamese</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Seafood">Seafood</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Burger">Burger</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Vegetarian">Vegetarian</button>
      <button class="fs-chip" data-filter="cuisine" data-value="Sushi">Sushi</button>
    </div>
  </div>
</div>

<div id="profile-panel">
  <div class="panel-handle"></div>
  <div class="profile-header">
    <div class="profile-title">My Ratings</div>
    <button id="profile-close" aria-label="Close">&#x2715;</button>
  </div>
  <div class="profile-body">
    <div id="profile-user" style="display:none;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px;border:1px solid rgba(0,0,0,0.07);">
      <div id="profile-email" style="font-size:0.82rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      <button id="profile-signout-btn" style="margin-left:12px;flex-shrink:0;background:none;border:1px solid rgba(0,0,0,0.15);border-radius:20px;padding:4px 10px;font-size:0.75rem;color:var(--text-muted);cursor:pointer;font-family:inherit;">Sign out</button>
    </div>
    <div class="profile-stats">
      <div class="profile-stat">
        <div class="profile-stat-value" id="profile-total">0</div>
        <div class="profile-stat-label">Rated</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-value" id="profile-avg">—</div>
        <div class="profile-stat-label">Average</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-value" id="profile-top">—</div>
        <div class="profile-stat-label">Top score</div>
      </div>
    </div>
    <div class="profile-breakdown-title">Breakdown by score</div>
    <div id="profile-bars"></div>
    <div class="profile-list-title">All rated restaurants</div>
    <div id="profile-list"></div>
  </div>
</div>

<div id="loading-overlay">
  <h2>SCRAN</h2>
  <div class="spinner"></div>
  <p>Loading restaurants&hellip;</p>
</div>

<div id="error-toast"></div>

<div id="zoom-controls">
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="zoom-out" aria-label="Zoom out">−</button>
</div>

<div id="creator-panel">
  <div class="panel-handle"></div>
  <div class="panel-inner">
    <div class="panel-header">
      <div id="creator-panel-name"></div>
      <button id="creator-panel-close" aria-label="Close">&#x2715;</button>
    </div>
    <div id="creator-panel-location"></div>
    <div id="creator-panel-rating"></div>
    <button id="creator-rate-btn" class="creator-rate-btn">&#9733; Rate this restaurant</button>
    <div id="creator-panel-mentions"></div>
  </div>
</div>

<div id="mode-bar">
  <button id="all-restaurants-btn" aria-label="Toggle All Restaurants">&#x1F50D; All Restaurants</button>
  <button id="topjaw-mode-btn" aria-label="Toggle Topjaw mode">&#128247; Topjaw</button>
  <button id="tod-mode-btn" aria-label="Toggle Tod mode">&#11088; Tod Mode</button>
  <button id="list-toggle" aria-label="My Restaurants">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <circle cx="3" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    My Restaurants
  </button>
</div>

<div id="rating-panel" class="hidden">
  <div class="panel-handle"></div>
  <div class="panel-inner">
    <div class="panel-header">
      <div id="panel-name">Restaurant Name</div>
      <button id="panel-close" aria-label="Close">&#x2715;</button>
    </div>
    <div id="panel-address"></div>
    <div id="panel-cuisine"></div>
    <div id="panel-google" hidden></div>
    <div class="rating-label">Tap to rate out of 10</div>
    <div id="rating-buttons"></div>
    <textarea id="panel-note" rows="2" placeholder="Add a note… (great pasta, very noisy, etc.)"></textarea>
    <div class="panel-actions">
      <button id="bookmark-btn" aria-label="Want to visit">&#x2605; Want to Visit</button>
    </div>
    <div class="panel-actions" style="margin-top:8px;">
      <button id="share-btn">&#x1F517; Share</button>
      <button id="clear-rating-btn">Clear Rating</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
